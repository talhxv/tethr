services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - VITE_NOTION_TOKEN=${VITE_NOTION_TOKEN}
      - VITE_NOTION_DB_ID=${VITE_NOTION_DB_ID}
      - VITE_NOTION_APPLICATIONS_DB_ID=${VITE_NOTION_APPLICATIONS_DB_ID}
      - SITE_URL=${SITE_URL:-https://tethrhq.com}
      - TALLY_WEBHOOK_SECRET=${TALLY_WEBHOOK_SECRET}
      # Book a Call (see booking-setup.md). NOTION_TOKEN falls back to
      # VITE_NOTION_TOKEN when left empty.
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_LEADS_DB_ID=${NOTION_LEADS_DB_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - BOOKING_CALENDAR_ID=${BOOKING_CALENDAR_ID:-}
      - BOOKING_TIMEZONE=${BOOKING_TIMEZONE:-Asia/Karachi}
      - BOOKING_DAYS=${BOOKING_DAYS:-1,2,3,4,5}
      - BOOKING_START=${BOOKING_START:-09:00}
      - BOOKING_END=${BOOKING_END:-23:00}
      - BOOKING_SLOT_MINUTES=${BOOKING_SLOT_MINUTES:-30}
      - BOOKING_BUFFER_MINUTES=${BOOKING_BUFFER_MINUTES:-15}
      - BOOKING_MIN_NOTICE_HOURS=${BOOKING_MIN_NOTICE_HOURS:-12}
      - BOOKING_HORIZON_DAYS=${BOOKING_HORIZON_DAYS:-14}
    expose:
      - "3000"
